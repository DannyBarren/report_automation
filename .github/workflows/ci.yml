name: CI

on:
  push:
  pull_request:

jobs:
  ruff-and-pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.17.1 pytest==8.4.2 -r requirements-ci.txt
      - name: Ruff
        run: ruff check .
      - name: Auth and boot tests
        run: pytest tests/test_auth.py tests/test_runtime_secrets.py -q --strict-markers
